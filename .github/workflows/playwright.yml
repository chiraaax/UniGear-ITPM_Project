name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      PORT: 5000
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      NEXT_PUBLIC_S3_BASE_URL: ${{ secrets.NEXT_PUBLIC_S3_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start backend
        run: npm start > ../server.log 2>&1 &
        working-directory: ./server

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:5000/api/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend failed to start"
          cat server.log
          exit 1

      - name: Start frontend
        run: npm start > ../client.log 2>&1 &
        working-directory: ./client

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:3000; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend failed to start"
          cat client.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Show backend logs if failed
        if: failure()
        run: cat server.log || true

      - name: Show frontend logs if failed
        if: failure()
        run: cat client.log || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30